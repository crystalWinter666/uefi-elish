[boot_shim]
requires_kernel_header = true

# Installed elish XBL uefiplat.cfg, UEFI FD.
[uefi_fd]
base = 0x9FC00000
size = 0x300000

# Stock elish boot.img uses a gzip kernel and Android header v3. The bootloader
# supplies the FDT via vendor_boot in that format. Custom image acceptance is
# pending a fastboot boot test.
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb = false

[boot_image]
header_version = 3
